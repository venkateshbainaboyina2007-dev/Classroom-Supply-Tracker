openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Classroom Supplies Usage & Replenishment Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: supplies
    description: Supply inventory management
  - name: usage-logs
    description: Supply usage logging
  - name: dashboard
    description: Dashboard summaries and analytics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /supplies:
    get:
      operationId: listSupplies
      tags: [supplies]
      summary: List all supplies
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of supplies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supply"
    post:
      operationId: createSupply
      tags: [supplies]
      summary: Create a supply item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplyInput"
      responses:
        "201":
          description: Created supply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supply"

  /supplies/low-stock:
    get:
      operationId: getLowStockSupplies
      tags: [supplies]
      summary: Get supplies at or below reorder threshold
      responses:
        "200":
          description: Low stock supplies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supply"

  /supplies/categories:
    get:
      operationId: listCategories
      tags: [supplies]
      summary: List all supply categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /supplies/{id}:
    get:
      operationId: getSupply
      tags: [supplies]
      summary: Get a supply by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Supply details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supply"
        "404":
          description: Not found
    patch:
      operationId: updateSupply
      tags: [supplies]
      summary: Update a supply
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplyUpdate"
      responses:
        "200":
          description: Updated supply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supply"
        "404":
          description: Not found
    delete:
      operationId: deleteSupply
      tags: [supplies]
      summary: Delete a supply
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /supplies/{id}/restock:
    post:
      operationId: restockSupply
      tags: [supplies]
      summary: Restock a supply item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestockInput"
      responses:
        "200":
          description: Updated supply after restock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supply"
        "404":
          description: Not found

  /usage-logs:
    get:
      operationId: listUsageLogs
      tags: [usage-logs]
      summary: List usage logs
      parameters:
        - name: supplyId
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of usage logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsageLog"
    post:
      operationId: createUsageLog
      tags: [usage-logs]
      summary: Log supply usage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageLogInput"
      responses:
        "201":
          description: Created usage log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageLog"
        "400":
          description: Insufficient stock

  /usage-logs/{id}:
    get:
      operationId: getUsageLog
      tags: [usage-logs]
      summary: Get a usage log by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Usage log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageLog"
        "404":
          description: Not found
    delete:
      operationId: deleteUsageLog
      tags: [usage-logs]
      summary: Delete a usage log
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent supply activity
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Recent activity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Supply:
      type: object
      required: [id, name, category, quantity, unit, reorderThreshold, reorderQuantity, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        quantity:
          type: number
        unit:
          type: string
        reorderThreshold:
          type: number
        reorderQuantity:
          type: number
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    SupplyInput:
      type: object
      required: [name, category, quantity, unit, reorderThreshold, reorderQuantity]
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        quantity:
          type: number
          minimum: 0
        unit:
          type: string
          minLength: 1
        reorderThreshold:
          type: number
          minimum: 0
        reorderQuantity:
          type: number
          minimum: 1
        notes:
          type: string

    SupplyUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        quantity:
          type: number
          minimum: 0
        unit:
          type: string
          minLength: 1
        reorderThreshold:
          type: number
          minimum: 0
        reorderQuantity:
          type: number
          minimum: 1
        notes:
          type: string

    RestockInput:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: number
          minimum: 1
        notes:
          type: string

    UsageLog:
      type: object
      required: [id, supplyId, supplyName, quantityUsed, usedBy, usedAt]
      properties:
        id:
          type: integer
        supplyId:
          type: integer
        supplyName:
          type: string
        quantityUsed:
          type: number
        usedBy:
          type: string
        notes:
          type: ["string", "null"]
        usedAt:
          type: string

    UsageLogInput:
      type: object
      required: [supplyId, quantityUsed, usedBy]
      properties:
        supplyId:
          type: integer
        quantityUsed:
          type: number
          minimum: 0.01
        usedBy:
          type: string
          minLength: 1
        notes:
          type: string

    DashboardSummary:
      type: object
      required: [totalSupplies, lowStockCount, outOfStockCount, totalUsageToday, totalUsageThisWeek, categoryCounts]
      properties:
        totalSupplies:
          type: integer
        lowStockCount:
          type: integer
        outOfStockCount:
          type: integer
        totalUsageToday:
          type: integer
        totalUsageThisWeek:
          type: integer
        categoryCounts:
          type: array
          items:
            $ref: "#/components/schemas/CategoryCount"

    CategoryCount:
      type: object
      required: [category, count]
      properties:
        category:
          type: string
        count:
          type: integer

    ActivityItem:
      type: object
      required: [id, supplyId, supplyName, quantityUsed, usedBy, usedAt, type]
      properties:
        id:
          type: integer
        supplyId:
          type: integer
        supplyName:
          type: string
        quantityUsed:
          type: number
        usedBy:
          type: string
        notes:
          type: ["string", "null"]
        usedAt:
          type: string
        type:
          type: string
          enum: [usage, restock]
